apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp064-api
  labels:
    app: mp064-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp064-api
  template:
    metadata:
      labels:
        app: mp064-api
    spec:
      containers:
        - name: mp064-api
          image: mp064-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
