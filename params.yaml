# Settings for the MP064 canteen pipeline. Read with yaml.safe_load (see src/canteen/config.py).
paths:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  findings: reports/findings.yaml
  data_issues: reports/data_issues.json
  cleaning_rules: reports/cleaning_rules.json
  monitoring_report: reports/monitoring.json
  model: models/model.joblib
  predictions: predictions/holdout_predictions.csv

data:
  id_column: record_id
  date_column: date
  target: plates_sold
  group_column: block
  numeric_features:
    - students_on_campus
    - menu_price_rs
    - temp_c
    - exam_days_left
    - special_dishes
    - queue_minutes_yesterday
  categorical_features:
    - day_type
    - block
  # the real categories; spelling variants are mapped onto these
  levels:
    day_type: [weekday, saturday, holiday]
    block: [A-Block, B-Block, Hostel]

checks:
  sentinel_candidates: [-1, -9, -99, -999, -9999, 9, 99, 999, 9999]
  sentinel_min_count: 5
  unit_factors: [10, 12, 60, 100, 1000]
  unit_tolerance: 0.15
  leak_corr_threshold: 0.98
  stuck_min_days: 7
  typo_ratio: 3.0          # target above typo_ratio x median is a candidate typo

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp064-canteen-lunch-rush
  registered_model_name: mp064-plates-sold-regressor
  champion_alias: champion
  validation_fraction: 0.2   # last 20% of cleaned train (by date) used for model selection
  random_state: 42
  # 6 settings are tried for v1; the lowest validation MAE becomes version 1
  # (v2 re-selects among the same settings, validating inside the first 70% of later.csv)
  experiments:
    - {name: ridge, model: ridge, params: {alpha: 1.0}}
    - {name: rf_depth8, model: random_forest, params: {n_estimators: 200, max_depth: 8, min_samples_leaf: 3}}
    - {name: rf_depth14, model: random_forest, params: {n_estimators: 300, max_depth: 14, min_samples_leaf: 2}}
    - {name: gbr_lr05, model: gradient_boosting, params: {n_estimators: 300, learning_rate: 0.05, max_depth: 3}}
    - {name: gbr_lr10, model: gradient_boosting, params: {n_estimators: 200, learning_rate: 0.10, max_depth: 4}}
    - {name: gbr_d2, model: gradient_boosting, params: {n_estimators: 400, learning_rate: 0.05, max_depth: 2}}

monitoring:
  psi_bins: 10
  retrain_fraction: 0.70     # first 70% of later.csv (by date) goes into v2 training
  promote_min_improvement: 0.05   # promote v2 only if MAE is at least 5% lower than v1
